name: Automated Testing Suite & Coverage

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test-suite:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js LTS
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Create .env for CI
        run: |
          cat > .env << EOF
          NODE_ENV=test
          PORT=5501
          JWT_SECRET=ci-test-secret-key-12345
          JWT_EXPIRES_IN=1d
          DB_URI=mongodb://127.0.0.1:27017/subscription-tracker-test
          LOG_LEVEL=error
          EOF

      - name: Install Dependencies
        run: npm ci

      - name: Run Unit & Integration Tests with Coverage
        run: npm run test:coverage -- --forceExit
        env:
          NODE_ENV: test
          JWT_SECRET: ci-test-secret-key-12345
          DB_URI: mongodb://127.0.0.1:27017/subscription-tracker-test
          LOG_LEVEL: error

      - name: Upload Coverage Report Artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 14
