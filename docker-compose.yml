services:
  # ==========================================
  # MongoDB Database Service
  # ==========================================
  mongodb:
    image: mongo:7.0
    container_name: subpulse-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: adminpassword
      MONGO_INITDB_DATABASE: subscription-tracker
    volumes:
      - mongo-data:/data/db
    networks:
      - subpulse-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ==========================================
  # SubPulse Next.js Application - Production Profile
  # ==========================================
  app:
    profiles: ["production"]
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    container_name: subpulse-app-prod
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      DB_URI: mongodb://admin:adminpassword@mongodb:27017/subscription-tracker?authSource=admin
    depends_on:
      mongodb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - subpulse-network

  # ==========================================
  # SubPulse Application - Development Profile
  # ==========================================
  app-dev:
    profiles: ["development"]
    build:
      context: .
      dockerfile: Dockerfile
      target: builder
    container_name: subpulse-app-dev
    command: npm run dev
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: development
      PORT: 3000
      DB_URI: mongodb://admin:adminpassword@mongodb:27017/subscription-tracker?authSource=admin
    volumes:
      - .:/app
      - /app/node_modules
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - subpulse-network

networks:
  subpulse-network:
    driver: bridge
    name: subpulse-network

volumes:
  mongo-data:
    name: subpulse-mongo-data
